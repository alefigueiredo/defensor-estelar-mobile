name: Gerar APK Android (Defensor Estelar)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Copiar assets do jogo para o pacote Android
        run: |
          mkdir -p android_apk/app/src/main/assets
          cp mobile_android/index.html android_apk/app/src/main/assets/index.html
          cp mobile_android/manifest.json android_apk/app/src/main/assets/manifest.json

      - name: Compilar APK Android
        working-directory: android_apk
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../DefensorEstelar.apk

      - name: Publicar APK nos Artifacts do Workflow
        uses: actions/upload-artifact@v4
        with:
          name: DefensorEstelar-Android-APK
          path: DefensorEstelar.apk

      - name: Publicar APK na aba Releases (Download Direto no Celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "🚀 Defensor Estelar Mobile v1.0.0 (APK Android)"
          body: "Baixe o arquivo **DefensorEstelar.apk** abaixo diretamente no seu celular Android para instalar o jogo!"
          files: DefensorEstelar.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
